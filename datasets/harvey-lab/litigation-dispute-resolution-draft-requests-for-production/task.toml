version = "1.0"

[task]
name = "harvey-lab/litigation-dispute-resolution-draft-requests-for-production"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "medium"
category = "legal-draft"
tags = ["Litigation (General)", "discovery", "requests-for-production", "breach-of-contract", "trade-secrets", "distribution-agreements", "Intellectual Property"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 750

[verifier.env]
GEMINI_API_KEY = "${GEMINI_API_KEY}"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 20480
