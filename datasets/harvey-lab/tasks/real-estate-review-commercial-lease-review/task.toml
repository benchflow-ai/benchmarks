version = "1.0"

[task]
name = "harvey-lab/real-estate-review-commercial-lease-review"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "medium"
category = "legal-review"
tags = ["real-estate", "lease-review", "commercial-lease"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 885

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 20480
