version = "1.0"

[task]
name = "harvey-lab/environmental-esg-identify-issues-in-environmental-impact-statement"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "medium"
category = "legal-review"
tags = ["Environmental", "NEPA", "EIS", "renewable-energy", "public-lands", "endangered-species", "litigation-risk", "regulatory"]

