version = "1.0"

[task]
name = "harvey-lab/tax-draft-tax-due-diligence-report"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "medium"
category = "legal-draft"
tags = ["Tax", "due-diligence", "mergers-and-acquisitions", "private-equity", "Section-338(h)(10)", "stock-purchase", "C-corporation", "state-and-local-tax", "corporate-structure"]

[agent]
timeout_sec = 2250

[verifier]
timeout_sec = 1125

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 20480
