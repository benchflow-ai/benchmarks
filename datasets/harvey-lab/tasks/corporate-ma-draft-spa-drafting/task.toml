version = "1.0"

[task]
name = "harvey-lab/corporate-ma-draft-spa-drafting"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "hard"
category = "legal-draft"
tags = ["M&A", "spa", "acquisition"]

[agent]
