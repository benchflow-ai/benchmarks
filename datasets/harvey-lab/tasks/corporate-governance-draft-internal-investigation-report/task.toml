author_email = "labs@harvey.ai"
difficulty = "hard"
category = "legal-draft"
tags = ["Compliance & Regulatory", "internal-investigation", "privileged-memorandum", "banking-regulation", "whistleblower", "Bank Secrecy Act", "False Claims Act", "underwriting-fraud", "audit-committee", "remedial-actions", "OCC-compliance"]

