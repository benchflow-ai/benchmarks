version = "1.0"

[task]
name = "harvey-lab/banking-finance-draft-credit-compliance-cert"

[metadata]
author_name = "Harvey AI"
author_email = "labs@harvey.ai"
difficulty = "hard"
category = "legal-draft"
tags = ["leveraged-finance", "credit-agreement", "compliance-certificate", "financial-covenants", "covenant-calculations", "quarterly-reporting", "syndicated-lending"]

